# local 개발용 PostgreSQL = pgVector
services:
  db:
    # postgreSQL, pgvector 버전 고정
    image: pgvector/pgvector:0.8.7-pg17-trixie

    # .env에서 환경 변수 가져오기
    environment:
      POSTGRES_DB:        "${DB_NAME:?DB_NAME is required}"
      POSTGRES_USER:      "${DB_USER:?DB_USER is required}"
      POSTGRES_PASSWORD:  "${DB_PASSWORD:?DB_PASSWORD is required}"

    # PC의 127.0.0.1:5433을 컨테이너의 5432에 연결
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT is required}:5432"

    # 컨테이너를 다시 만들어도 DB 데이터 유지
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:   